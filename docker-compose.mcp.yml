services:
  transcriptlab:
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      ASPNETCORE_URLS: "http://+:5000;http://+:5001"
      Mcp__Enabled: "true"
      Mcp__PrivatePort: "5001"
      Mcp__CursorIntegrityKeyFile: /run/secrets/transcriptlab-mcp-cursor-integrity-key
    secrets:
      - source: transcriptlab-mcp-cursor-integrity-key
        target: /run/secrets/transcriptlab-mcp-cursor-integrity-key
        mode: 0444

secrets:
  transcriptlab-mcp-cursor-integrity-key:
    file: ${MCP_CURSOR_KEY_FILE}
